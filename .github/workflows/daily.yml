# Mỗi tối: tải kết quả XSMB mới, tính dự đoán kỳ tiếp theo, đăng trang lên GitHub Pages.
# Chạy tay: tab Actions -> "Cập nhật XSMB hằng ngày" -> Run workflow.
name: Cập nhật XSMB hằng ngày

on:
  schedule:
    # Giờ UTC. 11:40 UTC = 18:40 giờ VN (sau khi quay xong); 13:30 UTC = 20:30 VN (chạy bù
    # nếu lần trước bị trễ hoặc kỳ chưa đủ số). GitHub có thể chạy trễ vài chục phút.
    - cron: "40 11 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit file dữ liệu mới
  pages: write      # đăng GitHub Pages
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Tải kết quả mới nhất
        run: python -m src.crawler

      - name: Dự đoán và tạo trang
        # đồng thời ghi số gợi ý kỳ tới vào sổ theo dõi data/predictions.csv
        run: python -m src.predict --site site

      - name: Lưu dữ liệu và sổ dự đoán vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/   # predictions.csv có thể chưa tồn tại ở lần chạy đầu
          if git diff --cached --quiet; then
            echo "Không có kết quả hay dự đoán mới."
          else
            git commit -m "Cập nhật kết quả & dự đoán XSMB $(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
